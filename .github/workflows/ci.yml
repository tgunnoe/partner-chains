name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: [ self-hosted, nixos ]
          - name: aarch64-darwin
            runner: [ self-hosted, macos ]
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Attic cache
        env:
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          attic login --set-default admin "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          attic use "$ATTIC_CACHE"

      - name: Build and cache flake outputs
        env:
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
        run: |
          # nix-instantiate -E '(builtins.getFlake "path:${builtins.toString ./.}").packages."${builtins.currentSystem}".ci' --add-root temp-ci-drv --indirect | \
          # nix-store --stdin -q --references | \
          # nix-store --stdin --realise -v -j auto | \
          # nix-store --stdin -qR --include-outputs | \
          # tr '\n' ' ' | \
          # xargs attic push "$ATTIC_CACHE"
          # rm temp-ci-drv
          nix-instantiate -E '(builtins.getFlake "path:${builtins.toString ./.}").packages."${builtins.currentSystem}".ci' --add-root temp-ci-drv --indirect > top-drv.path
          all_drvs=$(cat top-drv.path; cat top-drv.path | nix-store --stdin -q --references | nix-store --stdin -q --references | sort | uniq)
          echo "$all_drvs" | nix-store --stdin --realise -v -j auto --add-root realized-drvs --indirect > realized-drvs.paths
          cat realized-drvs.paths | nix-store --stdin -q --outputs | sort | uniq | nix-store --stdin -qR --include-outputs | tr '\n' ' ' | xargs attic push "$ATTIC_CACHE"
          rm temp-ci-drv top-drv.path realized-drvs*
      # - name: Push built outputs to Attic
      #   #if: github.ref == 'refs/heads/master'
      #   env:
      #     ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
      #     ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
      #   run: nix path-info --recursive ./result-ci | attic push --stdin "$ATTIC_CACHE"
